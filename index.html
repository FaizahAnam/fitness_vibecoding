<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitness Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>Fitness Tracker</h1>
        <p>Log your workouts and stay on track.</p>
      </div>
      <div class="user-info">
        <span id="username-display"></span>
        <button id="logout-btn">Log Out</button>
      </div>
    </div>
  </header>

  <main>
    <div class="main-tabs">
      <button class="main-tab active" data-tab="log">Log Workout</button>
      <button class="main-tab" data-tab="heatmap">This Month</button>
    </div>

    <!-- Tab 1: Log Workout -->
    <div id="tab-log">
      <section class="log-form">
        <h2>Log a Workout</h2>
        <form id="workout-form">
          <div class="field">
            <label for="exercise">Exercise</label>
            <input type="text" id="exercise" placeholder="e.g. Running, Squats" required>
          </div>
          <div class="field">
            <label for="duration">Duration (minutes)</label>
            <input type="number" id="duration" min="1" placeholder="30" required>
          </div>
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
          <div class="field">
            <label for="notes">Notes (optional)</label>
            <input type="text" id="notes" placeholder="How did it go?">
          </div>
          <button type="submit">Add Workout</button>
        </form>
      </section>

      <section class="workout-list">
        <h2>Past Workouts</h2>
        <ul id="workouts"></ul>
        <p id="empty-state">No workouts logged yet. Add one above!</p>
      </section>
    </div>

    <!-- Tab 2: Heatmap -->
    <div id="tab-heatmap" hidden>
      <section>
        <div class="heatmap-header">
          <button id="prev-month" aria-label="Previous month">&#8249;</button>
          <h2 id="heatmap-title"></h2>
          <button id="next-month" aria-label="Next month">&#8250;</button>
        </div>
        <div class="heatmap-legend">
          <span class="legend-item"><span class="legend-swatch" data-level="0"></span>No workout</span>
          <span class="legend-item"><span class="legend-swatch" data-level="1"></span>1 workout</span>
          <span class="legend-item"><span class="legend-swatch" data-level="2"></span>2 workouts</span>
          <span class="legend-item"><span class="legend-swatch" data-level="3"></span>3+</span>
        </div>
        <div class="heatmap-grid">
          <div class="day-label">Mon</div>
          <div class="day-label">Tue</div>
          <div class="day-label">Wed</div>
          <div class="day-label">Thu</div>
          <div class="day-label">Fri</div>
          <div class="day-label">Sat</div>
          <div class="day-label">Sun</div>
          <div id="heatmap-cells"></div>
        </div>
        <p id="heatmap-summary"></p>
      </section>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
